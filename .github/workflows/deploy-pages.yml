name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos y comportamiento
        run: |
          npm run check
          npm test
      - name: Construir sitio estático
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || steps.pages.outputs.base_path }}
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
